      function scrollFunction() {
      if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
        scrollTopButton.style.display = "block";
      } else {
        scrollTopButton.style.display = "none";
      }
    }

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.2/sweetalert.min.js" integrity="sha512-AA1Bzp5Q0K1KanKKmvN/4d3IRKVlv9PYgwFPvm32nPO6QS8yH1HO7LbgB1pgiOxPtfeg5zEn2ba64MUcqJx6CA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script>
    var namerror = false;
    var emailerror = false;
    var passworderror = false;
    var confirmerror = false;
    var code = Math.floor(1000 + Math.random() * 9000);
    var strongPass = new RegExp("^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#\$%\^&\*])(?=.{6,})");
    var btnclicked = false;
    const mailformat = /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;

    function DisplayResults(e) {
      var name = document.forms["regform"]["name"].value.trim();
      var email = document.forms["regform"]["email"].value.trim();
      var password = document.forms["regform"]["password"].value;
      var confirmpassword = document.forms["regform"]["retypepassword"].value;
      var error = document.getElementById("errormessage");

      if (name.length == 0) {
        namerror = true;
        error.style.display = "block";
        error.innerHTML = `<p><span class="error">Name should not be empty</span></p>`;
      } else if (email.length == 0) {
        emailerror = true;
        error.style.display = "block";
        error.innerHTML = `<p><span class="error">Email should not be empty</span></p>`;
      } else if (!mailformat.test(email)) {
        error.style.display = "block";
        error.innerHTML = `<p><span class="error">Email address is invalid</span></p>`;
      } else if (password.length < 6) {
        passworderror = true;
        error.style.display = "block";
        error.innerHTML = `<p><span class="error">Password must be at least 6 characters long.</span></p>`;
      } else if (password != confirmpassword) {
        confirmerror = true;
        error.style.display = "block";
        error.innerHTML = `<p><span class="error">Passwords do not match</span></p>`;
      } else {
        // Derive username from email or name
        var username = email.split('@')[0].replace(/[^a-zA-Z0-9_]/g, '') + Math.floor(Math.random() * 100);
        api.auth.register({
          email: email,
          username: username,
          password: password,
          confirm_password: confirmpassword,
          first_name: name
        }).then(res => {
          if (res.success) {
            swal({
              title: "Registration Successful!",
              text:  "Happy to have you aboard",
              type: "success",
              icon: "success",
            });
            setTimeout(function () {
              window.location.href = "home.html";
            }, 1500);
          } else {
            error.style.display = "block";
            var errMsg = res.message || "Registration failed.";
            if (res.errors) {
              if (res.errors.email) errMsg = "Email: " + res.errors.email[0];
              else if (res.errors.username) errMsg = "Username: " + res.errors.username[0];
              else if (res.errors.password) errMsg = "Password: " + res.errors.password[0];
            }
            error.innerHTML = `<p><span class="error">${errMsg}</span></p>`;
          }
        });
      }
      return false;
    }

    function FinalResults(){
      return false;
    }

    function change(e) {
      var name = document.forms["regform"]["name"].value;
      var error = document.getElementById("errormessage");
      var email = document.forms["regform"]["email"].value;
      var password = document.forms["regform"]["password"].value;
      var confirmpassword = document.forms["regform"]["retypepassword"].value;
      if (namerror == true) {
        if (name.length > 0) {
          namerror = false;
          error.style.display = "none";
        }
      } else if (emailerror == true) {
        if (email.length > 0) {
          emailerror = false;
          error.style.display = "none";
        }
      } else if (passworderror == true) {
        if (password.length > 0) {
          passworderror = true;
          error.style.display = "none";
        }
      } else if (confirmerror == true) {
        if (confirmpassword == password) {
          confirmerror = false;
          error.style.display = "none";
        }
      }
    }
  </script>
